version = 1

# SchemaSmith-authored source is under the SchemaSmith Community License (SSCL) v2.0,
# declared as a custom LicenseRef (text in LICENSES/LicenseRef-SSCL-2.0.txt) because SSCL
# is not on the SPDX License List. Bulk-declared by path so no per-file SPDX headers are
# needed — this leaves the existing copyright-header CI check untouched.
#
# Demos/ is deliberately excluded: it bundles third-party sample schemas under their own
# licenses (AdventureWorks, Chinook, Northwind, Sakila) alongside SchemaSmith-authored
# demos, so a blanket declaration would mislabel the third-party content.
[[annotations]]
path = [
  "Schema/**", "SchemaQuench/**", "SchemaTongs/**", "DataTongs/**", "SchemaShears/**",
  "TestProducts/**", "action/**", "packaging/**", "scripts/**", "docs/**",
  "*.cs", "*.sln", "*.md",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2024-present SchemaSmith Contributors"
SPDX-License-Identifier = "LicenseRef-SSCL-2.0"
