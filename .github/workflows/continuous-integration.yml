name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '**/*.md'
      - 'LICENSE'
      - '.gitignore'
      # Demo/lab scripts are doc/demo content (Rule 6 carve-out): a lab .ps1/.sh/.sql is not product
      # code and should not spin the three-engine container matrix. Package JSON and .json-schemas
      # under Demos are deliberately NOT excluded — validate-demo-schemas.yml reads them and DoD #9
      # (the --Validate SS-STALE-001 staleness check) keeps them current, so those still trigger CI.
      - 'Demos/**/*.ps1'
      - 'Demos/**/*.sh'
      - 'Demos/**/*.sql'
      # install.sh is not built, not covered by any test, and nothing in CI exercises it, so a change
      # to it cannot alter a test outcome -- yet it spun the whole three-engine matrix. NOTE: this is
      # coupled to release.yml's is_non_product list. Once CI skips these commits they have no
      # check-runs at all, and a release cut straight after one fails the gate with 'check not found'
      # unless the gate can walk back to a product-identical ancestor. The two lists move together.
      - 'packaging/install/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '**/*.md'
      - 'LICENSE'
      - '.gitignore'
      # Demo/lab scripts are doc/demo content (Rule 6 carve-out): a lab .ps1/.sh/.sql is not product
      # code and should not spin the three-engine container matrix. Package JSON and .json-schemas
      # under Demos are deliberately NOT excluded — validate-demo-schemas.yml reads them and DoD #9
      # (the --Validate SS-STALE-001 staleness check) keeps them current, so those still trigger CI.
      - 'Demos/**/*.ps1'
      - 'Demos/**/*.sh'
      - 'Demos/**/*.sql'
      # install.sh is not built, not covered by any test, and nothing in CI exercises it, so a change
      # to it cannot alter a test outcome -- yet it spun the whole three-engine matrix. NOTE: this is
      # coupled to release.yml's is_non_product list. Once CI skips these commits they have no
      # check-runs at all, and a release cut straight after one fails the gate with 'check not found'
      # unless the gate can walk back to a product-identical ancestor. The two lists move together.
      - 'packaging/install/**'

# Two pushes in quick succession used to run both matrices to completion, and closing a PR did not
# stop its run -- a closed PR burned the full matrix until it was cancelled by hand. Cancellation is
# gated on pull_request so a push to main is never silently superseded.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_VERSION: '10.0.x'
  TEST_USER: TestUser
  TEST_PASSWORD: 'aCa2d805-41E5@40c4!98e7#92F93zzxo176'

permissions:
  contents: read

jobs:
  build-and-unit-tests:
    name: Build & Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore SchemaSmith.sln

      - name: Build
        run: dotnet build SchemaSmith.sln --no-restore -c Debug

      - name: Schema Unit Tests
        run: dotnet test Schema/Schema.UnitTests/Schema.UnitTests.csproj --no-build -c Debug --settings coverage.runsettings --collect "XPlat Code Coverage" --logger trx --results-directory TestResults

      - name: SchemaQuench Unit Tests
        run: dotnet test SchemaQuench/SchemaQuench.UnitTests/SchemaQuench.UnitTests.csproj --no-build -c Debug --settings coverage.runsettings --collect "XPlat Code Coverage" --logger trx --results-directory TestResults

      - name: SchemaTongs Unit Tests
        run: dotnet test SchemaTongs/SchemaTongs.UnitTests/SchemaTongs.UnitTests.csproj --no-build -c Debug --settings coverage.runsettings --collect "XPlat Code Coverage" --logger trx --results-directory TestResults

      - name: DataTongs Unit Tests
        run: dotnet test DataTongs/DataTongs.UnitTests/DataTongs.UnitTests.csproj --no-build -c Debug --settings coverage.runsettings --collect "XPlat Code Coverage" --logger trx --results-directory TestResults

      - name: SchemaShears Unit Tests
        run: dotnet test SchemaShears/SchemaShears.UnitTests/SchemaShears.UnitTests.csproj --no-build -c Debug --settings coverage.runsettings --collect "XPlat Code Coverage" --logger trx --results-directory TestResults

      - name: SchemaQuench --Validate Package Linter Tests
        # The Category=Validate integration tests exercise the offline --Validate package linter and
        # need no database — they run here rather than in an engine job, which each filter Category=<Engine>
        # and would otherwise never run them (that gap let SS-STALE-001 schema staleness go undetected).
        run: dotnet test SchemaQuench/SchemaQuench.IntegrationTests/SchemaQuench.IntegrationTests.csproj --no-build -c Debug --settings coverage.runsettings --collect "XPlat Code Coverage" --filter "Category=Validate" --logger trx --results-directory TestResults

      - name: Upload Test Results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ always() }}
        with:
          name: unit-test-results
          path: TestResults
          if-no-files-found: ignore
          retention-days: 7

      - name: Test Summary
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3
        if: ${{ !cancelled() && hashFiles('TestResults/*.trx') != '' }}
        with:
          name: Unit Tests
          path: TestResults/*.trx
          reporter: dotnet-trx
          only-summary: 'true'
          use-actions-summary: 'true'

  integration-tests-sqlserver:
    name: Integration Tests (SQL Server ${{ matrix.ss }})
    runs-on: ubuntu-latest
    needs: [build-and-unit-tests, sweep-record]
    # SQL Server has the MOST version-specific behaviour of the four engines -- compat-level cliffs, the
    # OPENJSON/STRING_AGG boundary, catalog columns that arrive in 2017, ledger in 2022, native json in
    # 2025 -- and until now it had the FEWEST legs: one, 2019, which is neither the floor nor the latest.
    # The reclaimed minutes from the matrix-shape change are spent here, which is what they were for.
    #
    # A pull request runs floor + latest (2017 + latest), the same rule the other engines follow.
    #
    # WHY SQL SERVER FLOATS TOO, and why `latest` duplicating the 2025 pin is the point rather than waste.
    # An earlier draft pinned every SQL Server leg and excluded it from the ratchet, justified by "its legs
    # are all pinned so there is no floating leg to ratchet" -- which is circular, and leaves the ONE engine
    # that started this whole investigation (a single pinned 2019 leg that silently decayed) free to decay
    # again the day the next version ships. `latest` and `2025-latest` are the same digest today, so the
    # floating leg costs one duplicate run now; the moment a new major ships it picks it up and TESTS it,
    # rather than merely telling us it exists. Finding out whether the new version breaks us is the whole
    # purpose -- "catch breaking changes when they happen" (Paul, 2026-09-20). Merge to main runs all four.
    #
    # scripts/run-modern-band-sweep.sh remains the evidence these bands are provisionable and green --
    # it is where 2017/2022/2025 were first proven, and its per-band notes are the source for the
    # Ubuntu-derived product line used by the full-text install below.
    # Combinations are defined wholly by `include`, NOT by a `ss:` list plus an `include` that supplies
    # each image. That shape looks tidier and is wrong: an include entry whose `ss` does not match an
    # existing combination is ADDED as a new one, so the 2019 and 2022 entries would reappear on a pull
    # request and silently undo the reduced matrix.
    strategy:
      fail-fast: false
      matrix:
        include: ${{ github.event_name == 'pull_request' && fromJSON('[{"ss":"2017","image":"mcr.microsoft.com/mssql/server:2017-CU31-GDR18-ubuntu-18.04"},{"ss":"2025","image":"mcr.microsoft.com/mssql/server:2025-CU9-ubuntu-24.04"}]') || fromJSON('[{"ss":"2017","image":"mcr.microsoft.com/mssql/server:2017-CU31-GDR18-ubuntu-18.04"},{"ss":"2019","image":"mcr.microsoft.com/mssql/server:2019-CU32-GDR11-ubuntu-20.04"},{"ss":"2022","image":"mcr.microsoft.com/mssql/server:2022-CU27-ubuntu-22.04"},{"ss":"2025","image":"mcr.microsoft.com/mssql/server:2025-CU9-ubuntu-24.04"}]') }}
    permissions:
      contents: read
      checks: write
    services:
      sqlserver:
        image: ${{ matrix.image }}
        env:
          SA_PASSWORD: ${{ env.TEST_PASSWORD }}
          ACCEPT_EULA: Y
        ports:
          - 1440:1433
        options: --name mssql
    steps:
      # MUST be first: "Provision the semantic language statistics database" below runs a script
      # from ./scripts/, which does not exist until the repo is checked out. It previously sat after
      # that step and failed with exit 127, skipping the entire SQL Server integration leg.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Full-Text Search on SQL Server
        run: |
          retry() {
            local n=1 max=3 delay=10
            while true; do
              if "$@"; then return 0; fi
              if [ $n -ge $max ]; then
                echo "Command failed after $n attempts: $*" >&2
                return 1
              fi
              echo "Attempt $n failed: $*  — retrying in ${delay}s" >&2
              sleep $delay
              n=$((n+1))
              delay=$((delay*2))
            done
          }
          # The apt source is per SQL Server product line AND per Ubuntu base, so it cannot be
          # hardcoded once the matrix spans four versions. Derive it from the image's own
          # /etc/os-release -- an unrecognised base must FAIL here rather than install nothing and let
          # the band read as a product failure (without full-text every SQL Server fixture dies in
          # OneTimeSetUp with error 7609).
          #
          # curl ONLY, and only when missing, which is what scripts/run-modern-band-sweep.sh does. This
          # used to also install `systemctl` -- a package that does not exist on Ubuntu 18.04, and never
          # used by anything here (the restart below is `docker container restart`). It went unnoticed
          # because the only SQL Server leg was 2019, whose 20.04 base does have it; the 2017 leg added
          # in this release is 18.04, and this step failed before a single test ran.
          retry docker exec -u 0 mssql apt-get update
          retry docker exec -u 0 mssql sh -c 'command -v curl >/dev/null || DEBIAN_FRONTEND=noninteractive apt-get install -y -qq curl'
          retry docker exec -u 0 mssql sh -c '
            set -e
            . /etc/os-release
            case "$VERSION_ID" in
              18.04) PROD=2017 ;;
              20.04) PROD=2019 ;;
              22.04) PROD=2022 ;;
              24.04) PROD=2025 ;;
              *) echo "unsupported Ubuntu base $VERSION_ID for mssql-server-fts" >&2; exit 1 ;;
            esac
            curl -fsSL "https://packages.microsoft.com/config/ubuntu/${VERSION_ID}/mssql-server-${PROD}.list"               -o /etc/apt/sources.list.d/mssql-server.list'
          retry docker exec -u 0 mssql apt-get update
          retry docker exec -u 0 mssql apt-get install -y mssql-server-fts
          docker container restart mssql

      - name: Wait for SQL Server to be ready
        run: |
          # The tools path moved between image generations (CU27 shipped mssql-tools, CU32 ships
          # mssql-tools18, which also needs -C). Detect it, exactly as provision-semantic-db.sh does.
          SQLCMD="$(docker exec mssql sh -c 'ls /opt/mssql-tools18/bin/sqlcmd /opt/mssql-tools/bin/sqlcmd 2>/dev/null | head -1')"
          if [ -z "$SQLCMD" ]; then echo "No sqlcmd in the mssql container" >&2; exit 1; fi
          case "$SQLCMD" in *tools18*) TLS=-C ;; *) TLS= ;; esac
          # Must FAIL when the server never answers. This loop previously swallowed every error and
          # fell through with exit 0, so on an image where the hardcoded sqlcmd path did not exist it
          # verified nothing at all and simply slept.
          for _ in $(seq 1 30); do
            if docker exec mssql "$SQLCMD" -S localhost -U sa -P "$TEST_PASSWORD" $TLS \
                 -Q "SELECT 1" > /dev/null 2>&1; then exit 0; fi
            sleep 2
          done
          echo "SQL Server never became ready" >&2
          exit 1

      - name: Provision the semantic language statistics database
        # STATISTICAL_SEMANTICS full-text columns cannot be created without it, so the tests covering
        # them would silently skip on a runner that lacks it -- and a test that only ever skips proves
        # nothing. mssql-server-fts ships the database as a backup, so this needs no download.
        #
        # NOT FATAL ON 2017, and this is not a shortcut. mssql-server-fts for 2017 ships a
        # semanticsdb.bak stamped 14.00.0700 while the engine is 14.00.3540, so the restore is refused
        # with Msg 3169 -- the backup shipped WITH the server cannot be restored INTO that server.
        # Failing the leg for that makes 2017 permanently uncertifiable over a packaging artifact that
        # is not ours, and dropping 2017 is not an option: it is a supported version and it earned its
        # leg by catching a real issue. scripts/run-modern-band-sweep.sh reached this conclusion first
        # and records the gap in its row; CI now matches it instead of rediscovering it one red run at
        # a time. The gap is annotated, never silent.
        #
        # Every OTHER version still fails hard. Semantic provisioning breaking on 2019/2022/2025 is a
        # real regression, and tolerating it everywhere to accommodate 2017 would throw away the
        # coverage this step exists to guarantee.
        run: |
          if ./scripts/provision-semantic-db.sh mssql sa "$TEST_PASSWORD"; then exit 0; fi
          if [ "${{ matrix.ss }}" = "2017" ]; then
            echo "::warning title=Semantic coverage skipped::SQL Server 2017 ships a semanticsdb.bak"\
                 "stamped for a different build than the engine (Msg 3169), so STATISTICAL_SEMANTICS"\
                 "tests self-skip on this leg. Known and accepted; see the comment on this step."
            exit 0
          fi
          echo "::error::Semantic provisioning failed on SQL Server ${{ matrix.ss }}, where it is expected to succeed."
          exit 1

      - name: Rename sa login to TestUser
        run: |
          # Path differs by image generation; tools18 also requires -C to trust the self-signed cert.
          SQLCMD="$(docker exec mssql sh -c 'ls /opt/mssql-tools18/bin/sqlcmd /opt/mssql-tools/bin/sqlcmd 2>/dev/null | head -1')"
          case "$SQLCMD" in *tools18*) TLS=-C ;; *) TLS= ;; esac
          docker exec mssql "$SQLCMD" -S localhost -U sa -P "$TEST_PASSWORD" $TLS \
            -Q "ALTER LOGIN [sa] WITH NAME = [$TEST_USER];"

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore & Build
        run: dotnet build SchemaSmith.sln -c Debug

      - name: Run SQL Server Integration Tests
        env:
          # ONE leg runs the compat-100 / legacy-XML coverage; the rest skip it. Those tests branch on
          # a COMPATIBILITY LEVEL, not a server version, so all four legs were proving the same thing
          # four times -- and they are the most expensive tests in the suite because each kindles a
          # fresh database (48 scripts, ~864 KB of SQL, ~20s a kindle). RealCompat100Database alone is
          # 108s, 11% of a leg; the three together are ~150s, so three redundant legs cost about 7.5
          # billed minutes per merge.
          #
          # 2019 is the designated leg: it is among the shortest (13m47 against 2017 at 20m12), so the
          # cost lands where there is the most headroom. Unset locally, which means a developer running
          # the suite still gets them -- this is a CI-matrix economy, not a coverage reduction. A
          # genuinely version-specific XML defect is the genuine-binary sweep's job, against real
          # 2008R2-2016 binaries where the below-cliff path actually matters.
          SS_COMPAT_LEG: ${{ matrix.ss == '2019' && 'true' || 'skip' }}
        run: |
          dotnet test Schema/Schema.IntegrationTests/Schema.IntegrationTests.csproj --no-build -c Debug --settings coverage.runsettings --collect "XPlat Code Coverage" --filter "Category=SqlServer" --logger trx --results-directory TestResults
          dotnet test SchemaQuench/SchemaQuench.IntegrationTests/SchemaQuench.IntegrationTests.csproj --no-build -c Debug --settings coverage.runsettings --collect "XPlat Code Coverage" --filter "Category=SqlServer" --logger trx --results-directory TestResults
          dotnet test SchemaTongs/SchemaTongs.IntegrationTests/SchemaTongs.IntegrationTests.csproj --no-build -c Debug --settings coverage.runsettings --collect "XPlat Code Coverage" --filter "Category=SqlServer" --logger trx --results-directory TestResults
          dotnet test DataTongs/DataTongs.IntegrationTests/DataTongs.IntegrationTests.csproj --no-build -c Debug --settings coverage.runsettings --collect "XPlat Code Coverage" --filter "Category=SqlServer" --logger trx --results-directory TestResults

      - name: Upload Test Results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ always() }}
        with:
          name: sqlserver-${{ matrix.ss }}-test-results
          path: TestResults
          if-no-files-found: ignore
          retention-days: 7

      - name: Test Summary
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3
        if: ${{ !cancelled() && hashFiles('TestResults/*.trx') != '' }}
        with:
          name: SQL Server Integration Tests
          path: TestResults/*.trx
          reporter: dotnet-trx
          only-summary: 'true'
          use-actions-summary: 'true'

  integration-tests-postgresql:
    name: Integration Tests (PostgreSQL ${{ matrix.pg }})
    runs-on: ubuntu-latest
    needs: [build-and-unit-tests, sweep-record]
    # latest + the intermediate/floor versions (14, 13, 12): the real old containers are the only way to
    # exercise the version-adaptive branches below 15 (physical-column-existence questions no override can
    # fake) — attcompression + expression statistics (14), DROP EXPRESSION (13), getOwnedSequence (12).
    # MATRIX SHAPE (Paul, 2026-09-20). A pull request runs FLOOR + LATEST per engine; the full matrix
    # runs on merge to main. No nightly -- a scheduled run would re-test code nobody is waiting on.
    # The intermediate versions are what a PR gives up, and they are the ones that mostly duplicate
    # the latest leg; the floors are where the version-adaptive branches actually differ, which is why
    # they are never the ones dropped. The accepted risk is that a break confined to an intermediate
    # version is caught at merge rather than on the PR, and the mitigation is process, not CI: the full
    # gate and floor sweep are run locally before a PR is opened -- including, for an external
    # contribution, by a maintainer on the contributor's behalf.
    strategy:
      fail-fast: false
      matrix:
        pg: ${{ github.event_name == 'pull_request' && fromJSON('["18","12"]') || fromJSON('["18","17","16","15","14","13","12"]') }}
    permissions:
      contents: read
      checks: write
    services:
      postgres:
        image: postgres:${{ matrix.pg }}
        env:
          POSTGRES_USER: ${{ env.TEST_USER }}
          POSTGRES_PASSWORD: ${{ env.TEST_PASSWORD }}
          POSTGRES_DB: TestMain
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U TestUser -d TestMain"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 15s
    steps:
      - name: Increase PostgreSQL max connections
        run: |
          apply_and_wait() {
            PGPASSWORD="$TEST_PASSWORD" psql -h 127.0.0.1 -U "$TEST_USER" -d TestMain -c "ALTER SYSTEM SET max_connections = 2000;"
            # shellcheck disable=SC2046  # docker restart accepts multiple IDs; word splitting is intentional
            docker restart $(docker ps -q --filter "ancestor=postgres:${{ matrix.pg }}")
            sleep 5
            for _ in $(seq 1 30); do
              PGPASSWORD="$TEST_PASSWORD" psql -h 127.0.0.1 -U "$TEST_USER" -d TestMain -c "SELECT 1" > /dev/null 2>&1 && break
              sleep 2
            done
          }
          get_max_conn() {
            PGPASSWORD="$TEST_PASSWORD" psql -h 127.0.0.1 -U "$TEST_USER" -d TestMain -tAc "SHOW max_connections" 2>/dev/null | tr -d '[:space:]'
          }
          # max_connections is a postmaster-level setting: ALTER SYSTEM only takes effect after a
          # restart, and restarting a service container can silently race — leaving PostgreSQL at the
          # default 100 and starving the parallel fan-out tests ("too many clients already"). Apply,
          # then VERIFY it actually took (retry once), and fail loudly in setup rather than mid-suite.
          apply_and_wait
          actual="$(get_max_conn)"
          if [ "$actual" != "2000" ]; then
            echo "max_connections=$actual after first apply; retrying"
            apply_and_wait
            actual="$(get_max_conn)"
          fi
          echo "PostgreSQL max_connections=$actual"
          [ "$actual" = "2000" ] || { echo "ERROR: could not raise PostgreSQL max_connections to 2000 (got '$actual')"; exit 1; }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore & Build
        run: dotnet build SchemaSmith.sln -c Debug

      - name: Run PostgreSQL Integration Tests
        run: |
          dotnet test Schema/Schema.IntegrationTests/Schema.IntegrationTests.csproj --no-build -c Debug --settings coverage.runsettings --collect "XPlat Code Coverage" --filter "Category=PostgreSQL" --logger trx --results-directory TestResults
          dotnet test SchemaQuench/SchemaQuench.IntegrationTests/SchemaQuench.IntegrationTests.csproj --no-build -c Debug --settings coverage.runsettings --collect "XPlat Code Coverage" --filter "Category=PostgreSQL" --logger trx --results-directory TestResults
          dotnet test SchemaTongs/SchemaTongs.IntegrationTests/SchemaTongs.IntegrationTests.csproj --no-build -c Debug --settings coverage.runsettings --collect "XPlat Code Coverage" --filter "Category=PostgreSQL" --logger trx --results-directory TestResults
          dotnet test DataTongs/DataTongs.IntegrationTests/DataTongs.IntegrationTests.csproj --no-build -c Debug --settings coverage.runsettings --collect "XPlat Code Coverage" --filter "Category=PostgreSQL" --logger trx --results-directory TestResults

      - name: Upload Test Results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ always() }}
        with:
          name: postgresql-test-results-${{ matrix.pg }}
          path: TestResults
          if-no-files-found: ignore
          retention-days: 7

      - name: Test Summary
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3
        if: ${{ !cancelled() && hashFiles('TestResults/*.trx') != '' }}
        with:
          name: PostgreSQL ${{ matrix.pg }} Integration Tests
          path: TestResults/*.trx
          reporter: dotnet-trx
          only-summary: 'true'
          use-actions-summary: 'true'

  integration-tests-mysql:
    name: Integration Tests (MySQL ${{ matrix.mysql }})
    runs-on: ubuntu-latest
    needs: [build-and-unit-tests, sweep-record]
    # Current 8.0 + the supported floor (5.7). MySQL 5.7 lacks JSON_TABLE, CHECK constraints, descending indexes,
    # and RENAME COLUMN — the version-adaptive engine takes an equivalent path or degrades via the policy.
    strategy:
      fail-fast: false
      matrix:
        mysql: ${{ github.event_name == 'pull_request' && fromJSON('["26","5.7"]') || fromJSON('["26","8.4","8.0","5.7"]') }}
    permissions:
      contents: read
      checks: write
    env:
      # MySQL 5.7's TLS handshake is incompatible with the modern MySqlConnector's negotiation on the stock
      # image (SSL Authentication Error / "corrupted frame"); the integration suite tests schema, not transport,
      # so disable SSL for the 5.7 leg. 8.0 keeps the client default.
      SmithySettings_MySQL__ConnectionProperties__SslMode: ${{ matrix.mysql == '5.7' && 'None' || 'Preferred' }}
    services:
      mysql:
        image: mysql:${{ matrix.mysql }}
        env:
          MYSQL_ROOT_PASSWORD: ${{ env.TEST_PASSWORD }}
          MYSQL_USER: ${{ env.TEST_USER }}
          MYSQL_PASSWORD: ${{ env.TEST_PASSWORD }}
          MYSQL_DATABASE: TestMain
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -u root -p'aCa2d805-41E5@40c4!98e7#92F93zzxo176'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 30s
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Grant TestUser full privileges and increase max connections
        run: |
          mysql -h 127.0.0.1 -u root -p"$TEST_PASSWORD" -e "
            GRANT ALL PRIVILEGES ON *.* TO '$TEST_USER'@'%' WITH GRANT OPTION;
            FLUSH PRIVILEGES;
            SET GLOBAL max_connections = 2000;
          "

      - name: Restore & Build
        run: dotnet build SchemaSmith.sln -c Debug

      - name: Run MySQL Integration Tests
        run: |
          dotnet test Schema/Schema.IntegrationTests/Schema.IntegrationTests.csproj --no-build -c Debug --settings coverage.runsettings --collect "XPlat Code Coverage" --filter "Category=MySQL" --logger trx --results-directory TestResults
          dotnet test SchemaQuench/SchemaQuench.IntegrationTests/SchemaQuench.IntegrationTests.csproj --no-build -c Debug --settings coverage.runsettings --collect "XPlat Code Coverage" --filter "Category=MySQL" --logger trx --results-directory TestResults
          dotnet test SchemaTongs/SchemaTongs.IntegrationTests/SchemaTongs.IntegrationTests.csproj --no-build -c Debug --settings coverage.runsettings --collect "XPlat Code Coverage" --filter "Category=MySQL" --logger trx --results-directory TestResults
          dotnet test DataTongs/DataTongs.IntegrationTests/DataTongs.IntegrationTests.csproj --no-build -c Debug --settings coverage.runsettings --collect "XPlat Code Coverage" --filter "Category=MySQL" --logger trx --results-directory TestResults

      - name: Upload Test Results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ always() }}
        with:
          name: mysql-test-results-${{ matrix.mysql }}
          path: TestResults
          if-no-files-found: ignore
          retention-days: 7

      - name: Test Summary
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3
        if: ${{ !cancelled() && hashFiles('TestResults/*.trx') != '' }}
        with:
          name: MySQL ${{ matrix.mysql }} Integration Tests
          path: TestResults/*.trx
          reporter: dotnet-trx
          only-summary: 'true'
          use-actions-summary: 'true'

  integration-tests-mariadb:
    name: Integration Tests (MariaDB ${{ matrix.mariadb }})
    runs-on: ubuntu-latest
    needs: [build-and-unit-tests, sweep-record]
    # Current LTS (11.4, whose new utf8mb4_uca1400_ai_ci default collation exercises the data-delivery
    # collation fix #15), plus 10.6 and the supported floor (10.2). MariaDB 10.2-10.5 lacks JSON_TABLE
    # (recursive-CTE data delivery), RENAME COLUMN/INDEX, JSON_ARRAYAGG, and invisible/descending indexes.
    # MATRIX SHAPE (Paul, 2026-09-20). A pull request runs FLOOR + LATEST per engine; the full matrix
    # runs on merge to main. No nightly -- a scheduled run would re-test code nobody is waiting on.
    # The intermediate versions are what a PR gives up, and they are the ones that mostly duplicate
    # the latest leg; the floors are where the version-adaptive branches actually differ, which is why
    # they are never the ones dropped. The accepted risk is that a break confined to an intermediate
    # version is caught at merge rather than on the PR, and the mitigation is process, not CI: the full
    # gate and floor sweep are run locally before a PR is opened -- including, for an external
    # contribution, by a maintainer on the contributor's behalf.
    strategy:
      fail-fast: false
      matrix:
        mariadb: ${{ github.event_name == 'pull_request' && fromJSON('["13","10.2"]') || fromJSON('["13","11.8","11.4","10.6","10.2"]') }}
    permissions:
      contents: read
      checks: write
    env:
      # MariaDB 10.2's TLS handshake is incompatible with the modern MySqlConnector's negotiation on the stock
      # image (same SSL Authentication Error as MySQL 5.7); disable SSL for the 10.2 leg. 10.6/11.4 keep the default.
      SmithySettings_MariaDB__ConnectionProperties__SslMode: ${{ matrix.mariadb == '10.2' && 'None' || 'Preferred' }}
    services:
      mariadb:
        # MariaDB is a MySQL variant (GetBasePlatform() routes it to the MySQL engine + Scripts/MariaDb
        # overrides).
        image: mariadb:${{ matrix.mariadb }}
        env:
          MARIADB_ROOT_PASSWORD: ${{ env.TEST_PASSWORD }}
          MARIADB_USER: ${{ env.TEST_USER }}
          MARIADB_PASSWORD: ${{ env.TEST_PASSWORD }}
          MARIADB_DATABASE: TestMain
        ports:
          - 3317:3306
        # 10.2's bundled healthcheck.sh --innodb_initialized runs a privileged query as root with no
        # password and gets 'Access denied' (newer images auth via unix_socket; 10.2 requires the
        # password), so the container never turns healthy. Use the same mysqladmin ping the MySQL leg
        # uses for 10.2; keep healthcheck.sh for 10.6/11.4 where it works.
        options: >-
          --health-cmd "${{ matrix.mariadb == '10.2' && 'mysqladmin ping -h 127.0.0.1 -u root -p''aCa2d805-41E5@40c4!98e7#92F93zzxo176''' || 'healthcheck.sh --connect --innodb_initialized' }}"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 30s
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Grant TestUser full privileges and increase max connections
        run: |
          mysql -h 127.0.0.1 -P 3317 -u root -p"$TEST_PASSWORD" -e "
            GRANT ALL PRIVILEGES ON *.* TO '$TEST_USER'@'%' WITH GRANT OPTION;
            FLUSH PRIVILEGES;
            SET GLOBAL max_connections = 2000;
          "

      - name: Restore & Build
        run: dotnet build SchemaSmith.sln -c Debug

      - name: Run MariaDB Integration Tests
        run: |
          dotnet test Schema/Schema.IntegrationTests/Schema.IntegrationTests.csproj --no-build -c Debug --settings coverage.runsettings --collect "XPlat Code Coverage" --filter "Category=MariaDb" --logger trx --results-directory TestResults
          dotnet test SchemaQuench/SchemaQuench.IntegrationTests/SchemaQuench.IntegrationTests.csproj --no-build -c Debug --settings coverage.runsettings --collect "XPlat Code Coverage" --filter "Category=MariaDb" --logger trx --results-directory TestResults
          dotnet test SchemaTongs/SchemaTongs.IntegrationTests/SchemaTongs.IntegrationTests.csproj --no-build -c Debug --settings coverage.runsettings --collect "XPlat Code Coverage" --filter "Category=MariaDb" --logger trx --results-directory TestResults
          dotnet test DataTongs/DataTongs.IntegrationTests/DataTongs.IntegrationTests.csproj --no-build -c Debug --settings coverage.runsettings --collect "XPlat Code Coverage" --filter "Category=MariaDb" --logger trx --results-directory TestResults

      - name: Upload Test Results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ always() }}
        with:
          name: mariadb-test-results-${{ matrix.mariadb }}
          path: TestResults
          if-no-files-found: ignore
          retention-days: 7

      - name: Test Summary
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3
        if: ${{ !cancelled() && hashFiles('TestResults/*.trx') != '' }}
        with:
          name: MariaDB ${{ matrix.mariadb }} Integration Tests
          path: TestResults/*.trx
          reporter: dotnet-trx
          only-summary: 'true'
          use-actions-summary: 'true'

  # THE RATCHET, and it is the ONLY thing that resolves `latest`. No test leg floats any more.
  #
  # A floating leg keeps us current by ROTATING coverage rather than accumulating it: when `latest`
  # advances, the version it moved off stops being tested unless somebody pins it. PostgreSQL proved that
  # the expensive way -- `latest` walked 15 -> 16 -> 17 -> 18 and all three middle majors sat untested
  # inside a range the docs call continuous. A floating leg ALSO runs a full suite against whatever the
  # vendor shipped this morning, which is a result nobody can reproduce, and when it happens to resolve to
  # a major already pinned it is the same run twice: SQL Server's `latest` and its `2025` leg were exactly
  # that, two ~1.5 GB boots and two full suites for one digest.
  #
  # So every test leg is now an explicit major, and the question a floating leg used to answer --
  # "has the ceiling moved?" -- is answered HERE, by comparison instead of by a test run. Two
  # assertions, and the second is the one that used to be missing:
  #   1. each engine's `latest` still resolves to the major declared in .github/engine-ceilings.json;
  #   2. that declared major actually HAS a pinned leg in this file. Without (2) the declaration could
  #      claim a ceiling nothing tests, which is the same hole in a tidier disguise.
  #
  # Clearing a failure is a deliberate decision rather than a version bump: add a leg for the new major,
  # or knowingly accept the hole. It runs on pull requests too, because that is where somebody is most
  # likely to notice and act.
  engine-ceiling-ratchet:
    name: Engine Ceiling Ratchet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compare each floating leg against its expected major
        run: |
          set -uo pipefail
          FAILED=0
          expect() { python3 -c "import json,sys; print(json.load(open('.github/engine-ceilings.json'))['$1'])"; }

          # Ask the image itself rather than a registry tag name: `latest` is what CI actually runs, so
          # the version the SERVER reports is the only answer that matches what was tested.
          actual_postgresql=$(docker run --rm postgres:latest postgres --version | grep -oE '[0-9]+' | head -1)
          actual_mysql=$(docker run --rm mysql:latest mysqld --version | grep -oE '[0-9]+\.[0-9]+' | head -1 | cut -d. -f1)
          actual_mariadb=$(docker run --rm mariadb:latest mariadbd --version | grep -oE '[0-9]+\.[0-9]+' | head -1 | cut -d. -f1)

          # SQL Server resolves by MANIFEST DIGEST rather than by booting the server: the image is ~1.5 GB
          # and needs an SA password and a startup wait just to answer a version query, while MCR publishes
          # a `<year>-latest` tag per major. If `latest` still points at the same digest as
          # `<expected>-latest`, the ceiling has not moved. If it points at none of them, a new major has
          # shipped -- which is exactly the signal.
          want_ss=$(expect sqlserver)
          SS_ACCEPT='application/vnd.docker.distribution.manifest.list.v2+json,application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.v2+json,application/vnd.oci.image.manifest.v1+json'
          dg() { curl -sS --max-time 30 -I -H "Accept: $SS_ACCEPT" "https://mcr.microsoft.com/v2/mssql/server/manifests/$1" | tr -d '\r' | grep -i '^docker-content-digest:' | awk '{print $2}'; }
          ss_latest=$(dg latest)
          ss_want=$(dg "${want_ss}-latest")
          if [ -z "$ss_latest" ] || [ -z "$ss_want" ]; then
            echo "::error::Could not resolve the SQL Server manifest digests from MCR. Treating as a failure rather than a pass -- an undetected ceiling is the exact condition this job exists to catch."
            FAILED=1
          elif [ "$ss_latest" != "$ss_want" ]; then
            echo "::error::SQL Server latest no longer matches ${want_ss}-latest, so a new major has shipped."
            echo "::error::Do BOTH: (1) pin ${want_ss} as a permanent leg in continuous-integration.yml, scripts/run-modern-band-sweep.sh and release.yml's REQUIRED_CHECKS -- or decide out loud to accept the hole; (2) set sqlserver to the new year in .github/engine-ceilings.json."
            FAILED=1
          else
            echo "sqlserver latest = ${want_ss}-latest -- ceiling unchanged."
          fi

          for engine in postgresql mysql mariadb; do
            want=$(expect "$engine")
            eval "got=\$actual_$engine"
            if [ -z "$got" ]; then
              echo "::error::Could not determine the $engine major version from its latest image. Treating as a failure rather than a pass -- an undetected ceiling is the exact condition this job exists to catch."
              FAILED=1
            elif [ "$got" != "$want" ]; then
              echo "::error::$engine latest is now major $got; .github/engine-ceilings.json expects $want."
              echo "::error::This is the ratchet. The floating leg has MOVED, so major $want is now tested by nothing unless it is pinned."
              echo "::error::Do BOTH: (1) pin $want as a permanent leg in continuous-integration.yml, scripts/run-floor-sweep.sh and release.yml's REQUIRED_CHECKS -- or decide out loud to accept the hole; (2) set $engine to $got in .github/engine-ceilings.json."
              echo "::error::Updating the json alone is how the gap comes back."
              FAILED=1
            else
              echo "$engine latest = major $got (expected $want) -- ceiling unchanged."
            fi
          done

          # ASSERTION 2: the declared ceiling must actually HAVE a pinned leg in this file. Without this,
          # engine-ceilings.json could name a major nothing tests -- the same untested-ceiling hole, just
          # declared rather than drifted into. Greps this workflow for the version literal in that
          # engine's matrix, which is deliberately crude: it fails loudly on a reshaped matrix rather
          # than quietly passing on one it cannot parse.
          for engine in sqlserver postgresql mysql mariadb; do
            want=$(expect "$engine")
            case "$engine" in
              sqlserver)   key='"ss"' ;;
              postgresql)  key='pg:' ;;
              mysql)       key='mysql:' ;;
              mariadb)     key='mariadb:' ;;
            esac
            if ! grep -F "$key" .github/workflows/continuous-integration.yml | grep -qE "\"$want\""; then
              echo "::error::$engine declares a ceiling of $want in .github/engine-ceilings.json, but no"\
                   "leg in this workflow pins $want. Add the leg, or lower the declared ceiling on purpose."
              FAILED=1
            else
              echo "$engine ceiling $want has a pinned leg."
            fi
          done

          exit $FAILED

  coverage-gate:
    name: Coverage Gate
    runs-on: ubuntu-latest
    needs: [build-and-unit-tests, integration-tests-sqlserver, integration-tests-postgresql, integration-tests-mysql, integration-tests-mariadb]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install ReportGenerator
        run: dotnet tool install -g dotnet-reportgenerator-globaltool

      - name: Download coverage artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: coverage-artifacts
          # Trailing wildcard is required: the PostgreSQL and MariaDB legs are a version matrix, so
          # their artifacts are suffixed (postgresql-test-results-14, mariadb-test-results-10.6, ...).
          # A bare '*-test-results' silently drops every matrix leg from the merge — which zeroes out
          # PostgreSQL/MariaDB-only coverage (e.g. the PG<15 legacy-upsert path) and fails the gate.
          pattern: '*-test-results*'
          merge-multiple: true

      - name: Merge coverage
        run: |
          export PATH="$PATH:$HOME/.dotnet/tools"
          reportgenerator "-reports:coverage-artifacts/**/coverage.cobertura.xml" "-targetdir:coverage-merged" "-reporttypes:Cobertura;MarkdownSummaryGithub"

      - name: Publish coverage summary
        if: ${{ always() }}
        run: cat coverage-merged/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Check coverage thresholds
        run: python3 scripts/check-coverage-thresholds.py coverage-merged/Cobertura.xml

  # The genuine-binary sweep CANNOT run here -- no pre-2017 SQL Server Linux image exists, which is why
  # it is local-only in the first place. So the only thing CI can enforce is that somebody ran it against
  # a commit whose engine behaviour is still current. Human forgetting is the failure mode: two
  # 2017-vs-2016 defects reached the v2.5.0 cut because the sweep was skipped, not because it lacked
  # coverage. Seconds to run, and it needs full history to walk the record's commits.
  # Gates the four integration matrices below (see their needs:). This check answers in about ten
  # seconds; the matrices cost ~68 runner-minutes and ~14 minutes of wall clock between them, and
  # used to run to completion even after it had already failed.
  #
  # Deliberately NOT gating build-and-unit-tests: leaving that ungated lets the ~2m build and this
  # ~10s check overlap, so the happy path costs no extra wall clock at all while the sad path skips
  # everything expensive. coverage-gate needs the matrices, so it is gated transitively.
  #
  # Safe to gate on because 'Genuine Sweep Record' is NOT one of the twelve required status checks on
  # main -- verified against the ruleset. That matters: this workflow carries a paths-ignore for
  # docs/demos, so if it ever becomes required, ci-docs-only-companion.yml must report it too or a
  # docs-only PR waits forever on a context nothing emits -- the exact deadlock that companion exists
  # to fix.
  sweep-record:
    name: Genuine Sweep Record
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Sweep record still covers this tree
        run: bash scripts/check-sweep-record.sh
