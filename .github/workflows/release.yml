name: release

on:
  workflow_dispatch:

permissions:
  contents: write
  statuses: read
  checks: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  DOTNET_VERSION: '10.0.x'

jobs:
  read-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get-version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify CI passed
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          # Check names must match the CI job names exactly. Every engine's integration job is a matrix,
          # so each leg is a separate check (e.g. "Integration Tests (PostgreSQL 14)") and all must have
          # passed. A release must not cut with any leg, the Coverage Gate, or check-headers red.
          #
          # A RELEASE GATES ON EVERY LEG (Paul, 2026-09-20). Twenty integration legs plus the four
          # non-integration checks. That is the point of a release gate: the tag is the artifact users
          # install, so it must not cut with ANY supported version red -- including the floating `latest`
          # legs, which are where an engine release that broke us would show up first.
          #
          # THIS IS THE MERGE-TO-MAIN SET, NOT THE PULL-REQUEST SET, and the difference is deliberate.
          # Since 2026-09-20 a pull request runs a reduced matrix (floor + latest per engine) while
          # merge to main runs the full one, so main produces MORE checks than a PR does. A release is
          # cut from main and must be held to the full matrix -- listing only the PR set here would let
          # a release pass without ever having run PostgreSQL 14/13, MariaDB 10.6, or SQL Server
          # 2019/2022.
          #
          # KEEP IN SYNC with continuous-integration.yml's matrices AND with the `main` branch ruleset
          # (which carries the PR set) AND with ci-docs-only-companion.yml (which stubs the PR set). A
          # name here that CI no longer produces fails the release with "check not found"; a name CI
          # produces that is missing here lets a red leg through silently -- the worse of the two.
          REQUIRED_CHECKS=(
            "Build & Unit Tests"
            "Integration Tests (SQL Server 2017)"
            "Integration Tests (SQL Server 2019)"
            "Integration Tests (SQL Server 2022)"
            "Integration Tests (SQL Server 2025)"
            "Integration Tests (PostgreSQL latest)"
            "Integration Tests (PostgreSQL 17)"
            "Integration Tests (PostgreSQL 16)"
            "Integration Tests (PostgreSQL 15)"
            "Integration Tests (PostgreSQL 14)"
            "Integration Tests (PostgreSQL 13)"
            "Integration Tests (PostgreSQL 12)"
            "Integration Tests (MySQL latest)"
            "Integration Tests (MySQL 8.4)"
            "Integration Tests (MySQL 8.0)"
            "Integration Tests (MySQL 5.7)"
            "Integration Tests (MariaDB latest)"
            "Integration Tests (MariaDB 11.8)"
            "Integration Tests (MariaDB 11.4)"
            "Integration Tests (MariaDB 10.6)"
            "Integration Tests (MariaDB 10.2)"
            "Genuine Sweep Record"
            "Engine Ceiling Ratchet"
            "Coverage Gate"
            "check-headers"
          )

          # KEEP IN SYNC WITH continuous-integration.yml's paths-ignore. Every path CI skips must be
          # non-product here: a commit CI skipped has NO check-runs at all, so if the walk-back below
          # treats it as product it stops there and the gate fails with "check not found" on a tree
          # that is genuinely verified. The two lists had already drifted -- LICENSE, .gitignore and
          # the Demos script excludes were only ever in the CI list.
          #
          # A path that cannot change any test outcome. Everything else — all product code, engine
          # scripts, test projects, TestProducts, Demos (their .json-schemas are asserted by the
          # --Validate staleness check), and continuous-integration.yml itself, since changing CI
          # changes what "passed" means — is product for this purpose. The list is deliberately
          # conservative: a wrong "non-product" weakens the release gate, while a wrong "product"
          # only costs a CI re-run.
          is_non_product() {
            case "$1" in
              docs/*|*.md|LICENSE|.gitignore|.github/workflows/release.yml|.github/workflows/distribution-publish.yml|.github/ISSUE_TEMPLATE/*) return 0 ;;
              packaging/install/*|Demos/*/*.ps1|Demos/*/*.sh|Demos/*/*.sql) return 0 ;;
              *) return 1 ;;
            esac
          }

          # Build the set of commits whose green checks still hold for this tree: the release commit,
          # plus each ancestor that differs from it ONLY in non-product paths. Equivalence is computed
          # from the actual commit diff — never from a workflow trigger path-filter, and never by
          # stubbing a required check green, which would report success without the tests having run.
          TRUSTED_SHAS=("$RELEASE_SHA")
          CANDIDATE="$RELEASE_SHA"
          for _ in $(seq 1 25); do
            PARENT=$(git rev-parse --verify -q "${CANDIDATE}^") || break
            EQUIVALENT=1
            while IFS= read -r changed; do
              [ -z "$changed" ] && continue
              if ! is_non_product "$changed"; then EQUIVALENT=0; break; fi
            done < <(git diff --name-only "$PARENT" "$RELEASE_SHA")
            [ "$EQUIVALENT" -eq 1 ] || break
            TRUSTED_SHAS+=("$PARENT")
            CANDIDATE="$PARENT"
          done

          if [ "${#TRUSTED_SHAS[@]}" -gt 1 ]; then
            echo "Release commit differs from ${#TRUSTED_SHAS[@]} ancestor tree(s) only in non-product paths;"
            echo "their CI results still describe this product tree and are accepted:"
            for s in "${TRUSTED_SHAS[@]:1}"; do echo "  - $s"; done
          fi

          check_result_on() {
            gh api "repos/${REPO}/commits/$1/check-runs" \
              --jq "[.check_runs[] | select(.name == \"$2\")] | sort_by(.completed_at) | last | .conclusion"
          }

          FAILED=0
          for check in "${REQUIRED_CHECKS[@]}"; do
            PASSED_ON=""
            for sha in "${TRUSTED_SHAS[@]}"; do
              if [ "$(check_result_on "$sha" "$check")" = "success" ]; then PASSED_ON="$sha"; break; fi
            done
            if [ -z "$PASSED_ON" ]; then
              echo "::error::Required CI check '$check' has not passed on this commit or any product-identical ancestor. Run CI first."
              FAILED=1
            elif [ "$PASSED_ON" = "$RELEASE_SHA" ]; then
              echo "  ✓ $check"
            else
              echo "  ✓ $check (on product-identical ancestor ${PASSED_ON:0:8})"
            fi
          done
          if [ "$FAILED" -eq 1 ]; then
            exit 1
          fi
          echo "All required CI checks passed."

      - name: Extract version from Directory.Build.props
        id: get-version
        run: |
          VERSION=$(grep -oP '(?<=<Version>)[^<]+' Directory.Build.props)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "## Release version: $VERSION" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify tag does not exist
        run: |
          if git rev-parse "v${{ steps.get-version.outputs.version }}" >/dev/null 2>&1; then
            echo "::error::Tag v${{ steps.get-version.outputs.version }} already exists. Bump the version in Directory.Build.props first."
            exit 1
          fi

      - name: Verify CHANGELOG.md has a section for this version
        run: |
          VERSION="${{ steps.get-version.outputs.version }}"
          if [ ! -f CHANGELOG.md ]; then
            echo "::error::CHANGELOG.md not found in repo root."
            exit 1
          fi
          # Match either '## [v2.0.0]' (current/unreleased format) or
          # '## [v2.0.0](url) — date' (post-release format with link)
          if ! grep -qE "^## \[v${VERSION}\](\$|\()" CHANGELOG.md; then
            echo "::error::CHANGELOG.md is missing a section heading for v${VERSION}. Expected: '## [v${VERSION}]' (optionally followed by a link and date)."
            exit 1
          fi
          echo "CHANGELOG.md verified — section heading found for v${VERSION}"

  build-release:
    runs-on: ubuntu-latest
    needs: read-version
    strategy:
      matrix:
        rid: [win-x64, win-arm64, linux-x64, linux-arm64, osx-x64, osx-arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish tools
        run: |
          for tool in SchemaQuench SchemaTongs DataTongs SchemaShears; do
            dotnet publish $tool/$tool.csproj -c Release -r ${{ matrix.rid }} --self-contained
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-${{ matrix.rid }}
          path: |
            SchemaQuench/bin/Release/net10.0/${{ matrix.rid }}/publish/
            SchemaTongs/bin/Release/net10.0/${{ matrix.rid }}/publish/
            DataTongs/bin/Release/net10.0/${{ matrix.rid }}/publish/
            SchemaShears/bin/Release/net10.0/${{ matrix.rid }}/publish/
          retention-days: 1

  sign-windows:
    runs-on: windows-latest
    needs: build-release
    environment: release
    permissions:
      contents: read
    strategy:
      matrix:
        rid: [win-x64, win-arm64]
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-${{ matrix.rid }}
          path: bins

      - name: Collect binaries to sign
        shell: pwsh
        run: |
          $ours = @("SchemaQuench.exe", "SchemaTongs.exe", "DataTongs.exe", "SchemaShears.exe")
          $files = Get-ChildItem -Path bins -Recurse -File |
            Where-Object { $ours -contains $_.Name }
          $staging = New-Item -ItemType Directory -Force -Path sign-staging
          foreach ($f in $files) {
            $dest = "$staging\$($f.Name)"
            if (!(Test-Path $dest)) { Copy-Item $f.FullName $dest }
          }
          Write-Host "Files to sign:"
          Get-ChildItem $staging | ForEach-Object { Write-Host "  $($_.Name)" }

      - name: Sign binaries
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_SIGNING_PROFILE }}
          files-folder: sign-staging
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Copy signed binaries back
        shell: pwsh
        run: |
          $ours = @("SchemaQuench.exe", "SchemaTongs.exe", "DataTongs.exe", "SchemaShears.exe")
          $signed = Get-ChildItem -Path sign-staging -File
          $targets = Get-ChildItem -Path bins -Recurse -File |
            Where-Object { $ours -contains $_.Name }
          foreach ($s in $signed) {
            $targets | Where-Object { $_.Name -eq $s.Name } | ForEach-Object {
              Copy-Item $s.FullName $_.FullName -Force
              Write-Host "Signed: $($_.FullName)"
            }
          }

      - name: Re-upload signed artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-${{ matrix.rid }}-signed
          path: bins/
          retention-days: 1

  package-zip-windows:
    runs-on: ubuntu-latest
    needs: [build-release, sign-windows, read-version]
    strategy:
      matrix:
        rid: [win-x64, win-arm64]
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-${{ matrix.rid }}-signed
          path: bins

      - name: Assemble ZIP
        run: |
          VERSION="${{ needs.read-version.outputs.version }}"
          mkdir -p zip-staging
          for tool in SchemaQuench SchemaTongs DataTongs SchemaShears; do
            src="bins/$tool/bin/Release/net10.0/${{ matrix.rid }}/publish"
            if [ -d "$src" ]; then
              cp "$src"/* zip-staging/ 2>/dev/null || true
            fi
          done
          rm -f zip-staging/*.pdb
          echo "ZIP contents:"
          ls -la zip-staging/
          cd zip-staging && zip -r "../SchemaSmith-${VERSION}-${{ matrix.rid }}.zip" .

      - name: Upload ZIP
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: zip-${{ matrix.rid }}
          path: "SchemaSmith-*.zip"
          retention-days: 5

  package-tar-unix:
    runs-on: ubuntu-latest
    needs: [build-release, read-version]
    strategy:
      matrix:
        rid: [linux-x64, linux-arm64, osx-x64, osx-arm64]
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-${{ matrix.rid }}
          path: bins

      - name: Assemble tarball
        run: |
          VERSION="${{ needs.read-version.outputs.version }}"
          mkdir -p tar-staging
          for tool in SchemaQuench SchemaTongs DataTongs SchemaShears; do
            src="bins/$tool/bin/Release/net10.0/${{ matrix.rid }}/publish"
            if [ -d "$src" ]; then
              cp "$src"/* tar-staging/ 2>/dev/null || true
            fi
          done
          rm -f tar-staging/*.pdb
          chmod 0755 tar-staging/SchemaQuench tar-staging/SchemaTongs tar-staging/DataTongs tar-staging/SchemaShears
          echo "Tarball contents:"
          ls -la tar-staging/
          tar -czf "SchemaSmith-${VERSION}-${{ matrix.rid }}.tar.gz" -C tar-staging .

      - name: Upload tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: tar-${{ matrix.rid }}
          path: "SchemaSmith-*.tar.gz"
          retention-days: 5

  package-linux:
    runs-on: ubuntu-latest
    needs: [build-release, read-version]
    strategy:
      fail-fast: false
      matrix:
        fmt: [deb, rpm]
        arch: [amd64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Map matrix arch to RID
        id: rid
        run: |
          case "${{ matrix.arch }}" in
            amd64) echo "rid=linux-x64" >> "$GITHUB_OUTPUT" ;;
            arm64) echo "rid=linux-arm64" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Download build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-${{ steps.rid.outputs.rid }}
          path: bins

      - name: Install nfpm
        env:
          NFPM_VERSION: '2.46.3'
        run: |
          curl -sfL "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin nfpm
          nfpm --version

      - name: Stage binaries
        env:
          ICU_VERSION: '72.1.0.3'
        run: |
          RID="${{ steps.rid.outputs.rid }}"
          mkdir -p staging
          # Copy the four CLI binaries
          for tool in SchemaQuench SchemaTongs DataTongs SchemaShears; do
            src="bins/$tool/bin/Release/net10.0/$RID/publish/$tool"
            if [ ! -f "$src" ]; then
              echo "::error::Missing binary $src"
              exit 1
            fi
            cp "$src" "staging/$tool"
            chmod 0755 "staging/$tool"
          done
          # Copy the bundled ICU shared libs (from any one tool's publish dir — they're byte-identical
          # across tools because they come from the same package version pulled into each csproj).
          icu_src="bins/SchemaQuench/bin/Release/net10.0/$RID/publish"
          for lib in libicudata libicui18n libicuuc; do
            so="$icu_src/${lib}.so.${ICU_VERSION}"
            if [ ! -f "$so" ]; then
              echo "::error::Missing ICU shared lib $so"
              exit 1
            fi
            cp "$so" "staging/${lib}.so.${ICU_VERSION}"
            chmod 0644 "staging/${lib}.so.${ICU_VERSION}"
          done
          echo "Staged contents:"
          ls -la staging/

      - name: Render nfpm config
        env:
          VERSION: ${{ needs.read-version.outputs.version }}
          ARCH: ${{ matrix.arch }}
          ICU_VERSION: '72.1.0.3'
        run: |
          envsubst < packaging/linux/nfpm.yaml.template > nfpm.yaml
          echo "Rendered config:"
          cat nfpm.yaml

      - name: Pack ${{ matrix.fmt }}
        run: |
          mkdir -p output
          nfpm pkg --packager ${{ matrix.fmt }} -f nfpm.yaml -t output/
          echo "Built package:"
          ls -la output/

      - name: Upload package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: linux-pkg-${{ matrix.arch }}-${{ matrix.fmt }}
          path: "output/*.${{ matrix.fmt }}"
          retention-days: 5

  sbom:
    runs-on: ubuntu-latest
    needs: [read-version]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install CycloneDX
        run: dotnet tool install --global CycloneDX --version 6.2.0

      - name: Generate SBOM
        run: |
          VERSION="${{ needs.read-version.outputs.version }}"
          mkdir -p sbom
          dotnet CycloneDX SchemaSmith.sln \
            -o sbom \
            -fn "SchemaSmith-${VERSION}.cdx.json" \
            -F Json \
            -t \
            -ed \
            -sn SchemaSmith \
            -sv "$VERSION"
          echo "SBOM components: $(python3 -c "import json;print(len(json.load(open('sbom/SchemaSmith-${VERSION}.cdx.json'))['components']))")"

      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sbom
          path: sbom/*.cdx.json
          retention-days: 1

  create-release:
    runs-on: ubuntu-latest
    needs: [package-zip-windows, package-tar-unix, package-linux, read-version, sbom]
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download all ZIPs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: zip-*
          path: release-assets
          merge-multiple: true

      - name: Download all tarballs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: tar-*
          path: release-assets
          merge-multiple: true

      - name: Download all Linux packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: linux-pkg-*
          path: release-assets
          merge-multiple: true

      - name: Download SBOM
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: sbom
          path: release-assets

      - name: List release assets
        run: find release-assets -type f

      - name: Generate SHA256SUMS
        working-directory: release-assets
        run: |
          sha256sum -- * > SHA256SUMS
          echo "SHA256SUMS contents:"
          cat SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release-assets/*.zip
            release-assets/*.tar.gz
            release-assets/*.deb
            release-assets/*.rpm

      - name: Extract release notes from CHANGELOG
        run: |
          VERSION="${{ needs.read-version.outputs.version }}"
          # Capture from this version's heading line up to (but not including)
          # the next "## " heading. Match either '## [v2.0.0]' (current format)
          # or '## [v2.0.0](url) — date' (post-release format with link). Use
          # index() rather than a constructed-from-string regex to avoid awk's
          # string-escape rules eating the [ ] ( escape sequences.
          awk -v ver="$VERSION" '
            $0 == "## [v"ver"]" || index($0, "## [v"ver"](") == 1 { capture=1; next }
            capture && /^## / { exit }
            capture { print }
          ' CHANGELOG.md \
            | awk 'NF { p=1 } p' \
            | tac | awk 'NF { p=1 } p' | tac > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::Failed to extract release notes for v${VERSION} from CHANGELOG.md"
            exit 1
          fi
          echo "Extracted $(wc -l < release-notes.md) lines from CHANGELOG.md"

      - name: Create tag
        run: |
          git tag "v${{ needs.read-version.outputs.version }}"
          git push origin "v${{ needs.read-version.outputs.version }}"

      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ needs.read-version.outputs.version }}"
          gh release create "v${VERSION}" \
            --title "SchemaSmith v${VERSION}" \
            --notes-file release-notes.md \
            --draft \
            release-assets/*

  cleanup-artifacts:
    runs-on: ubuntu-latest
    needs: create-release
    permissions:
      actions: write
    steps:
      # Build/package artifacts are inter-job plumbing; the shippables live on the Release. Free the storage now.
      - name: Delete workflow artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" \
            --paginate --jq '.artifacts[].id' \
          | while read -r id; do
              gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id" && echo "deleted artifact $id"
            done
