name: CI (doc contract)

# A few documentation files are read by unit tests: CapabilityDocumentationTests parses the reference page's Engine
# Version Compatibility section and holds it to the capability registry, and SettingsDocumentationTests holds every
# reference page together to the settings the tools accept. An edit to one of those files cannot change
# what the engines do, so it runs the tests that read it instead of the full integration matrix. The paths below are
# a copy of the [unit-tested] section of .github/ci-tested-paths.txt (a trigger cannot read a file), and
# CiTestedPathsTests fails when the copies and the list disagree. A change that also touches a [tested] path runs
# these tests again inside continuous-integration.yml's unit-test job.

on:
  push:
    branches: [main]
    paths:
      - 'docs/end-user/reference/*.md'
      - 'docs/end-user/reference/schemas/**'
      - 'plugin/**'
      - '.github/workflows/ci-doc-contract.yml'
  pull_request:
    branches: [main]
    paths:
      - 'docs/end-user/reference/*.md'
      - 'docs/end-user/reference/schemas/**'
      - 'plugin/**'
      - '.github/workflows/ci-doc-contract.yml'

permissions:
  contents: read

jobs:
  doc-contract:
    name: Documentation Contract Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'

      - name: Tests that read the documentation
        run: |
          set -o pipefail
          dotnet test Schema/Schema.UnitTests/Schema.UnitTests.csproj -c Debug --filter "FullyQualifiedName~CapabilityDocumentationTests|FullyQualifiedName~SettingsDocumentationTests" | tee doc-contract.log
          # A filter that selects nothing exits 0, which would read as a pass.
          grep -Eq 'Total: +[1-9]' doc-contract.log || { echo '::error::the filter selected no tests'; exit 1; }

      - name: Tests that read the deployment summary's schema and reference page, and the Claude Code plugin
        run: |
          set -o pipefail
          dotnet test SchemaQuench/SchemaQuench.UnitTests/SchemaQuench.UnitTests.csproj -c Debug --filter "FullyQualifiedName~DeploymentSummarySchemaTests|FullyQualifiedName~DeploymentSummaryDocumentationTests|FullyQualifiedName~PluginContractTests" | tee summary-contract.log
          grep -Eq 'Total: +[1-9]' summary-contract.log || { echo '::error::the filter selected no tests'; exit 1; }
