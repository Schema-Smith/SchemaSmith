name: chocolatey-publish

on:
  release:
    types: [published]
  # Re-packs and re-pushes an existing release, e.g. to resubmit a version moderation sent back.
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to package (for example v2.7.2)
        required: true

permissions:
  contents: read

concurrency:
  group: chocolatey-publish-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Extract version from tag
        id: version
        shell: pwsh
        run: |
          $version = $env:TAG.TrimStart("v")
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Packaging schemasmith version: $version"

      - name: Download win-x64 bundle from Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $asset = "SchemaSmith-$version-win-x64.zip"
          gh release download $env:TAG --pattern $asset --repo ${{ github.repository }}
          if (-not (Test-Path $asset)) {
            Write-Error "Bundle ZIP $asset not found in release $env:TAG"
            exit 1
          }
          Write-Host "Downloaded: $asset"

      - name: Extract bundle into Chocolatey tools/
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $asset = "SchemaSmith-$version-win-x64.zip"
          $toolsDir = "packaging/chocolatey/schemasmith/tools"
          Expand-Archive -Path $asset -DestinationPath $toolsDir -Force
          Write-Host "Tools directory contents:"
          Get-ChildItem $toolsDir | ForEach-Object { Write-Host "  $($_.Name)" }

      - name: Stamp version and checksums
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $packageDir = "packaging/chocolatey/schemasmith"
          $toolsDir = "$packageDir/tools"
          $exes = Get-ChildItem $toolsDir -Filter *.exe | Sort-Object Name
          if ($exes.Count -eq 0) { Write-Error "No binaries in $toolsDir"; exit 1 }
          $checksums = ($exes | ForEach-Object {
            "  {0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name
          }) -join "`r`n"
          $nuspec = "$packageDir/schemasmith.nuspec"
          $verification = "$toolsDir/VERIFICATION.txt"
          foreach ($file in @($nuspec, $verification)) {
            $text = [IO.File]::ReadAllText($file)
            $text = $text.Replace('__VERSION__', $version).Replace('__CHECKSUMS__', $checksums)
            [IO.File]::WriteAllText($file, $text)
          }
          # A placeholder that reaches the moderators fails the review, so refuse to pack one.
          $left = Select-String -Path $nuspec, $verification -Pattern '__[A-Z]+__'
          if ($left) { $left | ForEach-Object { Write-Host $_ }; Write-Error "Unfilled placeholder in the package"; exit 1 }
          Write-Host "Stamped $version and $($exes.Count) checksums"
          Get-Content $verification

      - name: Pack Chocolatey package
        shell: pwsh
        working-directory: packaging/chocolatey/schemasmith
        run: |
          choco pack schemasmith.nuspec
          Get-ChildItem *.nupkg | ForEach-Object { Write-Host "Packed: $($_.Name)" }

      - name: Push to Chocolatey community feed
        shell: pwsh
        working-directory: packaging/chocolatey/schemasmith
        env:
          CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $package = "schemasmith.$version.nupkg"
          if (-not (Test-Path $package)) {
            Write-Error "Package $package not found"
            exit 1
          }
          choco push $package --source https://push.chocolatey.org/ --api-key $env:CHOCOLATEY_API_KEY
          Write-Host "Pushed: $package"
