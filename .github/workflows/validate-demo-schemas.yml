name: validate-demo-schemas

# Every shipped package file is validated against its committed editor schema -- the same 105 schema/pattern
# pairs as before, now in ONE job instead of a 105-entry matrix.
#
# WHY. Each matrix job averaged 9 seconds of actual work, but GitHub bills a job a full minute: ~105 billed
# minutes to do ~16 minutes of work, which was more than the entire 10-leg integration matrix cost. The pairs
# were never the expensive part; the per-job overhead was. Coverage is unchanged -- scripts/validate-demo-schemas.json
# carries the same pairs, and adding a package is a data edit rather than 3 more YAML lines and another runner.
#
# What changed besides the cost: failures are listed in this job's log (all of them, not one per job), and the
# per-pair PR comments the old action posted are gone along with the 105 check rows.

on:
  pull_request:
    paths:
      - 'Demos/**/*.json'
      - 'Demos/**/.json-schemas/*.schema'
      - 'scripts/validate-demo-schemas.mjs'
      - 'scripts/validate-demo-schemas.json'
      - '.github/workflows/validate-demo-schemas.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version: '22'

      - name: Install ajv
        run: npm install ajv@8 --no-save --no-audit --no-fund

      - name: Validate shipped packages against their committed schemas
        run: node scripts/validate-demo-schemas.mjs
