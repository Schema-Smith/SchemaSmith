name: CI (docs-only companion)

# Companion to continuous-integration.yml. That workflow's `pull_request` trigger carries a `paths-ignore`
# for docs/demos, so a docs-only PR never starts it — and the eight required status checks it would produce
# stay stuck on "Expected — Waiting for status to be reported", blocking the PR from merging forever. That
# only bites contributors WITHOUT admin bypass (an external drive-by fixing a typo); maintainers never see
# it because the Rule 6 doc/demo carve-out pushes such content straight to `main`.
#
# This companion fires on EXACTLY those excluded paths and reports the SAME check contexts as success,
# with no build and no containers.
#
# THE SET CHANGED 2026-09-20 with the matrix-shape decision, and the branch ruleset MUST be updated to
# match or the deadlock this file prevents comes back from the other direction -- a required context that
# no longer runs waits forever. A pull request now produces exactly these twelve:
#   Build & Unit Tests
#   Integration Tests (SQL Server 2017)        <- new name; "(SQL Server)" no longer exists
#   Integration Tests (SQL Server 2025)        <- new
#   Integration Tests (PostgreSQL latest)
#   Integration Tests (PostgreSQL 12)
#   Integration Tests (MySQL latest)         <- floating; replaced the pinned "(MySQL 8.0)" context
#   Integration Tests (MySQL 5.7)
#   Integration Tests (MariaDB latest)       <- floating; replaced the pinned "(MariaDB 11.4)" context
#   Integration Tests (MariaDB 10.2)
#   Genuine Sweep Record
#   Engine Ceiling Ratchet
#   Coverage Gate
# Removed from PR runs (still run on merge to main, so do NOT require them on a PR):
#   Integration Tests (PostgreSQL 17), (PostgreSQL 16), (PostgreSQL 15), (PostgreSQL 14), (PostgreSQL 13)
#   Integration Tests (MySQL 8.4), (MySQL 8.0)
#   Integration Tests (MariaDB 11.8), (MariaDB 11.4), (MariaDB 10.6)
#   Integration Tests (SQL Server 2019), (SQL Server 2022)
#
# The floating `latest` legs are REQUIRED, deliberately: an engine release that breaks us should stop a
# merge, not be scrolled past. They are also why this list can drift without anyone editing it -- when
# `latest` advances, the CONTEXT NAME does not change, but what it tested does. See the ratchet note in
# continuous-integration.yml. Do NOT delete the `paths-ignore` in the CI workflow — it exists so a prose
# fix doesn't spin the three-engine matrix; this pairs with it rather than replacing it.
#
# The `paths:` list below is the exact inverse of continuous-integration.yml's `pull_request` `paths-ignore`,
# and the job `name:` values are the exact required-check contexts from the `main` branch ruleset
# (`required_status_checks`) — keep both character-identical, or the deadlock returns (a mismatched name
# leaves the real context unreported). On a MIXED docs+code PR both this and the real CI run for the same
# contexts; the real jobs finish minutes later and are the most-recent run for each context, so the real
# result governs the merge.

on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
      - '*.md'
      - '**/*.md'
      - 'LICENSE'
      - '.gitignore'
      - 'Demos/**/*.ps1'
      - 'Demos/**/*.sh'
      - 'Demos/**/*.sql'

permissions:
  contents: read

jobs:
  build-and-unit-tests:
    name: Build & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - run: echo "docs-only change — no build required; satisfying the required check."

  integration-tests-sqlserver-2017:
    name: Integration Tests (SQL Server 2017)
    runs-on: ubuntu-latest
    steps:
      - run: echo "docs-only change — no integration run required."

  integration-tests-sqlserver-2025:
    name: Integration Tests (SQL Server 2025)
    runs-on: ubuntu-latest
    steps:
      - run: echo "docs-only change — no integration run required."

  integration-tests-postgresql-latest:
    name: Integration Tests (PostgreSQL latest)
    runs-on: ubuntu-latest
    steps:
      - run: echo "docs-only change — no integration run required."



  integration-tests-postgresql-12:
    name: Integration Tests (PostgreSQL 12)
    runs-on: ubuntu-latest
    steps:
      - run: echo "docs-only change — no integration run required."

  integration-tests-mysql-latest:
    name: Integration Tests (MySQL latest)
    runs-on: ubuntu-latest
    steps:
      - run: echo "docs-only change — no integration run required."

  integration-tests-mysql-57:
    name: Integration Tests (MySQL 5.7)
    runs-on: ubuntu-latest
    steps:
      - run: echo "docs-only change — no integration run required."

  integration-tests-mariadb-latest:
    name: Integration Tests (MariaDB latest)
    runs-on: ubuntu-latest
    steps:
      - run: echo "docs-only change — no integration run required."


  integration-tests-mariadb-102:
    name: Integration Tests (MariaDB 10.2)
    runs-on: ubuntu-latest
    steps:
      - run: echo "docs-only change — no integration run required."

  # Never stubbed before 2026-09-20, and latent rather than harmless: sweep-record lives in
  # continuous-integration.yml, which carries paths-ignore for docs -- so if this context is required, an
  # external contributor's docs-only PR waits on it forever. Maintainers would never hit it, because the
  # Rule 6 carve-out pushes docs straight to main. Stubbed here so it is safe whether the ruleset requires
  # it or not; a stub for a non-required context costs nothing.
  sweep-record:
    name: Genuine Sweep Record
    runs-on: ubuntu-latest
    steps:
      - run: echo "docs-only change — the recorded genuine-binary sweep still covers this tree."

  engine-ceiling-ratchet:
    name: Engine Ceiling Ratchet
    runs-on: ubuntu-latest
    steps:
      - run: echo "docs-only change — no engine ceiling check required."

  coverage-gate:
    name: Coverage Gate
    runs-on: ubuntu-latest
    steps:
      - run: echo "docs-only change — no coverage run required."
