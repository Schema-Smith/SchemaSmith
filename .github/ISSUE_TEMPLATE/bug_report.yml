name: Bug Report
description: Report a bug in SchemaSmith
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please fill out the details below so we can reproduce and fix it.

  - type: dropdown
    id: tool
    attributes:
      label: Tool
      description: Which SchemaSmith tool is affected?
      options:
        - SchemaQuench (deploy)
        - SchemaTongs (extract)
        - DataTongs (data sync)
        - SchemaShears (patch/subset packaging)
        - Other / Multiple
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: "Tool version (run with `--version` to check)"
      placeholder: "e.g., 2.0.0"
    validations:
      required: true

  - type: dropdown
    id: client-os
    attributes:
      label: Client OS / Runtime
      description: What OS is the CLI running on?
      options:
        - Windows
        - Linux
        - macOS
        - Docker
    validations:
      required: true

  - type: dropdown
    id: database-platform
    attributes:
      label: Database Platform
      description: "Primary platform you encountered the bug on. If you've also reproduced it on others, note them in the Description below."
      options:
        - SQL Server
        - PostgreSQL
        - MySQL
        - Other
    validations:
      required: true

  - type: input
    id: database-version
    attributes:
      label: Database Version & Edition
      description: "Target database version and edition"
      placeholder: "e.g., SQL Server 2019 Standard CU24, or PostgreSQL 16.3"
    validations:
      required: true

  - type: input
    id: database-os
    attributes:
      label: Database OS
      description: "OS the database server runs on (leave blank if same as client)"
      placeholder: "e.g., Linux container, Windows Server 2022"

  - type: input
    id: extensions
    attributes:
      label: Extensions / Distribution Flavor
      description: "Anything that distinguishes the engine from a vanilla install (extensions, hosted variants, forks)"
      placeholder: "e.g., Aurora PostgreSQL, pgvector 0.7, MariaDB 11.4"

  - type: textarea
    id: description
    attributes:
      label: Description
      description: "What happened? What did you expect to happen? If you've reproduced this on multiple platforms or versions, list them here."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Minimal steps to reproduce the issue
      placeholder: |
        1. Configure product with ...
        2. Run SchemaQuench with ...
        3. Observe error ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant Log Output
      description: Paste any relevant log output (passwords are redacted automatically by the tools)
      render: text

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Any other context — table JSON snippets, product config, screenshots, etc.
