name: schemasmith-learn-sandbox

# A throwaway four-engine sandbox for the Learn course labs.
# Stands up empty SQL Server, PostgreSQL, MySQL, and MariaDB engines; the learner
# installs the SchemaSmith CLI and runs it against these by hand.
# Engine versions and the MySQL/MariaDB function-trust flag mirror the demos under
# Demos/{SqlServer,PostgreSQL,MySQL,MariaDB}; ports are offset to avoid collisions.

services:
  sqlserver:
    # Overridable via MSSQL_IMAGE (2017 / 2019 / 2022 / 2025) -- pick a lighter/older
    # image for a faster first boot on slow hardware. See Demos/Learn/README.
    image: ${MSSQL_IMAGE:-mcr.microsoft.com/mssql/server:2022-latest}
    container_name: learn-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Learn!Passw0rd"
      MSSQL_PID: "Developer"
    ports:
      - "11433:1433"
    healthcheck:
      # "ready for client connections" is logged when master finishes recovery,
      # but on first boot sa auth can still fail while the system databases run a
      # one-time upgrade (the stock image ships templatedata older than its
      # binaries). Gate on an actual authenticated query so sqlserver-init and the
      # learner only start once the engine is genuinely usable. The upgrade is
      # I/O-bound and can take 15-20+ minutes on a slow/constrained backend, so
      # budget generously (~20m grace + 60 x 10s); a fast disk passes in seconds.
      # 2017 ships ONLY /opt/mssql-tools; 2019+ ship /opt/mssql-tools18, so an 18-only test can
      # never pass on 2017 -- and a never-healthy container blocks sqlserver-init, leaving the
      # `learn` database absent and every lab on the leg reporting NOT-RUN.
      test: ["CMD-SHELL", "for b in /opt/mssql-tools18/bin/sqlcmd /opt/mssql-tools/bin/sqlcmd; do [ -x $$b ] && $$b -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b >/dev/null 2>&1 && exit 0; done; exit 1"]
      interval: 15s
      timeout: 15s
      retries: 60
      start_period: 20m

  # One-shot: create the `learn` database on SQL Server so all three engines
  # have it ready (PostgreSQL and MySQL auto-create theirs via env vars; SQL
  # Server's image does not). Runs once after SQL Server is healthy, then exits.
  sqlserver-init:
    image: mcr.microsoft.com/mssql-tools
    container_name: learn-sqlserver-init
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: "no"
    entrypoint:
      - bash
      - -c
      - |
        for i in $$(seq 1 360); do
          /opt/mssql-tools/bin/sqlcmd -S sqlserver -U sa -P 'Learn!Passw0rd' -Q "IF DB_ID('learn') IS NULL CREATE DATABASE learn" && exit 0
          echo "waiting for SQL Server to accept the sa login... ($$i)"
          sleep 5
        done
        echo "init: gave up waiting for SQL Server" >&2; exit 1

  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16}
    container_name: learn-postgres
    # logical, so a publication on this server can feed the `replica` profile's subscriber (Course 9 M6).
    command: ["postgres", "-c", "wal_level=logical"]
    environment:
      POSTGRES_PASSWORD: "Learn!Passw0rd"
      POSTGRES_DB: "learn"
    ports:
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d learn"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s

  mysql:
    image: ${MYSQL_IMAGE:-mysql:8.0}
    container_name: learn-mysql
    command: --log-bin-trust-function-creators=1
    environment:
      MYSQL_ROOT_PASSWORD: "Learn!Passw0rd"
      MYSQL_DATABASE: "learn"
    ports:
      - "13306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  mariadb:
    image: ${MARIADB_IMAGE:-mariadb:11.4}
    container_name: learn-mariadb
    # max_allowed_packet raised to MySQL-parity (64M) so large data deliveries aren't rejected.
    command: --log-bin-trust-function-creators=1 --max-allowed-packet=64M
    environment:
      MARIADB_ROOT_PASSWORD: "Learn!Passw0rd"
      MARIADB_DATABASE: "learn"
    ports:
      - "13307:3306"
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh --connect --innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  # --- Opt-in mixed-version fleet (Course 10 · The Rolling Upgrade) --------------
  # Floor-version engines running ALONGSIDE the current ones above, so a single
  # package can be deployed across live version differences. Not started by a plain
  # `docker compose up` -- opt in with:  docker compose --profile mixed-fleet up -d
  # SQL Server is intentionally absent: Course 10 simulates its tiers via per-database
  # compatibility_level on the one `learn-sqlserver` (~2 GB/instance makes extra SQL
  # Server containers a bad ask on a learner's laptop). These three older images are
  # small and layer-share. Older MariaDB/MySQL take the MYSQL_* env vars.
  postgres-floor:
    image: postgres:12
    container_name: learn-postgres-12
    profiles: ["mixed-fleet"]
    environment:
      POSTGRES_PASSWORD: "Learn!Passw0rd"
      POSTGRES_DB: "learn"
    ports:
      - "15433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d learn"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s

  mysql-floor:
    image: mysql:5.7
    container_name: learn-mysql-57
    profiles: ["mixed-fleet"]
    command: --log-bin-trust-function-creators=1
    environment:
      MYSQL_ROOT_PASSWORD: "Learn!Passw0rd"
      MYSQL_DATABASE: "learn"
    ports:
      - "13316:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  mariadb-floor:
    image: mariadb:10.2
    container_name: learn-mariadb-102
    profiles: ["mixed-fleet"]
    # MariaDB 10.2 predates the MARIADB_* env vars and healthcheck.sh; use MYSQL_* + mysqladmin.
    command: --log-bin-trust-function-creators=1 --max-allowed-packet=64M
    environment:
      MYSQL_ROOT_PASSWORD: "Learn!Passw0rd"
      MYSQL_DATABASE: "learn"
    ports:
      - "13317:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # --- Opt-in newest tier (Course 10 · Module 1, "features newer than your newest server") ---
  # The newest releases, for features the current-tier engines above do not have yet: SQL Server
  # 2025 (JSON indexes on a `json` column) and MariaDB 11.8 (VECTOR indexes). Not started by a plain
  # `docker compose up` -- opt in with:  docker compose --profile latest-tier up -d
  # SQL Server is ~2 GB; mem_limit keeps it from taking the rest of the Docker VM.
  sqlserver-latest:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: learn-sqlserver-2025
    profiles: ["latest-tier"]
    mem_limit: 4g
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Learn!Passw0rd"
      MSSQL_PID: "Developer"
    ports:
      - "11434:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b >/dev/null 2>&1"]
      interval: 15s
      timeout: 15s
      retries: 60
      start_period: 20m

  mariadb-latest:
    image: mariadb:11.8
    container_name: learn-mariadb-118
    profiles: ["latest-tier"]
    command: --log-bin-trust-function-creators=1 --max-allowed-packet=64M
    environment:
      MARIADB_ROOT_PASSWORD: "Learn!Passw0rd"
      MARIADB_DATABASE: "learn"
    ports:
      - "13308:3306"
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh --connect --innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  # --- Opt-in SQL Server with Full-Text Search (Course 4 · Recipe 17) -------------
  # The stock image has no Full-Text Search. This one is built from it plus Microsoft's
  # mssql-server-fts package (Dockerfile.fts). Not started by a plain `docker compose up` --
  # opt in with:  docker compose --profile fts up -d --build sqlserver-fts
  sqlserver-fts:
    build:
      context: .
      dockerfile: Dockerfile.fts
    image: schemasmith-learn/mssql-fts:2022
    container_name: learn-sqlserver-fts
    profiles: ["fts"]
    mem_limit: 3g
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Learn!Passw0rd"
      MSSQL_PID: "Developer"
    ports:
      - "11436:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b >/dev/null 2>&1"]
      interval: 15s
      timeout: 15s
      retries: 60
      start_period: 20m

  # --- Opt-in SQL Server Express (Course 6 · Module 7; Course 7 · Module 7) --------
  # The same 2022 image as `sqlserver`, licensed as Express: online index operations are an
  # Enterprise/Developer feature, so OnlineApply's edition refusal shows here. Course 7 M7 also
  # uses it as a second, separate server. Opt in with:  docker compose --profile edition-tier up -d
  sqlserver-express:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: learn-sqlserver-express
    profiles: ["edition-tier"]
    mem_limit: 2g
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Learn!Passw0rd"
      MSSQL_PID: "Express"
    ports:
      - "11435:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b >/dev/null 2>&1"]
      interval: 15s
      timeout: 15s
      retries: 60
      start_period: 20m

  # --- Opt-in PostgreSQL subscriber (Course 9 · Module 6) --------------------------
  # A second PostgreSQL that subscribes to a publication on `postgres` (reached as host
  # `postgres` on the compose network). Opt in with:  docker compose --profile replica up -d
  postgres-replica:
    image: ${POSTGRES_IMAGE:-postgres:16}
    container_name: learn-postgres-replica
    profiles: ["replica"]
    environment:
      POSTGRES_PASSWORD: "Learn!Passw0rd"
      POSTGRES_DB: "learn"
    ports:
      - "15434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d learn"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s
