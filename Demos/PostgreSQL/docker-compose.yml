name: schemasmith-postgresql-demo

services:
  quench-adventureworks:
    image: ${SCHEMAQUENCH_IMAGE:-ghcr.io/schema-smith/schemaquench:latest}
    environment:
      - SmithySettings_Target__Server=demoserver
      - SmithySettings_Target__User=${PostGreSQL_USERNAME}
      - SmithySettings_Target__Password=${PostGreSQL_PASSWORD}
      - SmithySettings_SchemaPackagePath=/metadata
    volumes:
      - ./AdventureWorks:/metadata
    depends_on:
      demoserver:
        condition: service_healthy

  quench-chinook:
    image: ${SCHEMAQUENCH_IMAGE:-ghcr.io/schema-smith/schemaquench:latest}
    environment:
      - SmithySettings_Target__Server=demoserver
      - SmithySettings_Target__User=${PostGreSQL_USERNAME}
      - SmithySettings_Target__Password=${PostGreSQL_PASSWORD}
      - SmithySettings_SchemaPackagePath=/metadata
    volumes:
      - ./Chinook:/metadata
    depends_on:
      quench-adventureworks:
        condition: service_completed_successfully

  quench-northwind:
    image: ${SCHEMAQUENCH_IMAGE:-ghcr.io/schema-smith/schemaquench:latest}
    environment:
      - SmithySettings_Target__Server=demoserver
      - SmithySettings_Target__User=${PostGreSQL_USERNAME}
      - SmithySettings_Target__Password=${PostGreSQL_PASSWORD}
      - SmithySettings_SchemaPackagePath=/metadata
    volumes:
      - ./Northwind:/metadata
    depends_on:
      quench-chinook:
        condition: service_completed_successfully

  quench-sakila:
    image: ${SCHEMAQUENCH_IMAGE:-ghcr.io/schema-smith/schemaquench:latest}
    environment:
      - SmithySettings_Target__Server=demoserver
      - SmithySettings_Target__User=${PostGreSQL_USERNAME}
      - SmithySettings_Target__Password=${PostGreSQL_PASSWORD}
      - SmithySettings_SchemaPackagePath=/metadata
    volumes:
      - ./Sakila:/metadata
    depends_on:
      quench-northwind:
        condition: service_completed_successfully

  quench-tenantcrm:
    image: ${SCHEMAQUENCH_IMAGE:-ghcr.io/schema-smith/schemaquench:latest}
    environment:
      - SmithySettings_Target__Server=demoserver
      - SmithySettings_Target__User=${PostGreSQL_USERNAME}
      - SmithySettings_Target__Password=${PostGreSQL_PASSWORD}
      - SmithySettings_SchemaPackagePath=/metadata
    volumes:
      - ./TenantCRM:/metadata
    depends_on:
      quench-sakila:
        condition: service_completed_successfully

  demoserver:
    # Overridable via POSTGRES_IMAGE in .env. Must stay PostGIS-enabled — the demo deploys spatial columns.
    image: ${POSTGRES_IMAGE:-postgis/postgis:latest} # PostGIS-enabled PostgreSQL for spatial data support
    platform: linux/amd64 # postgis/postgis has no arm64 manifest; force amd64 emulation on macOS arm64
    ports:
      - "${PostGreSQL_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: TestMain
      POSTGRES_USER: ${PostGreSQL_USERNAME}
      POSTGRES_PASSWORD: ${PostGreSQL_PASSWORD}
      PGPASSWORD: ${PostGreSQL_PASSWORD}
    command: postgres -c max_connections=2000
    volumes:
      # Sentinel init script (99-*, runs last) — see healthcheck below.
      - ./docker/init:/docker-entrypoint-initdb.d
    healthcheck:
      # Two independent guards against a false-green mid-init (a fresh/cold volume takes the official
      # entrypoint through a temporary server that listens on the Unix socket only, with listen_addresses='',
      # while the real server — the one the quench chain reaches over TCP — is not yet up):
      #   1. -h 127.0.0.1 forces the probe onto TCP, the transport the dependent quenches actually use, so
      #      the socket-only init server can never satisfy it.
      #   2. _init_complete is created by the 99- init script as the LAST init step, so the query cannot
      #      succeed until the entrypoint's init phase has fully finished (the pattern MySQL/MariaDB use).
      test: ["CMD-SHELL", "psql -h 127.0.0.1 -U ${PostGreSQL_USERNAME} -d TestMain -c \"SELECT 1 FROM _init_complete LIMIT 1\" 2>/dev/null | grep -q 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

  completed:
    image: alpine
    entrypoint: ["echo"]
    command: ["completed"]
    depends_on:
      demoserver:
        condition: service_healthy
      quench-adventureworks:
        condition: service_completed_successfully
      quench-chinook:
        condition: service_completed_successfully
      quench-northwind:
        condition: service_completed_successfully
      quench-sakila:
        condition: service_completed_successfully
      quench-tenantcrm:
        condition: service_completed_successfully
